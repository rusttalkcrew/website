name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  # New rusttalk-next releases reach releases.json without a website commit.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
concurrency:
  group: website-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fresh release list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/releases.cjs
      - name: Skip a scheduled run when the live list is unchanged
        id: live
        if: github.event_name == 'schedule'
        run: |
          if curl -fsS --max-time 20 https://rusttalk.com/releases.json -o live.json && cmp -s live.json releases.json; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.live.outputs.same != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.live.outputs.same != 'true'
      - uses: docker/login-action@v3
        if: steps.live.outputs.same != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: steps.live.outputs.same != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rusttalkcrew/website
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        if: steps.live.outputs.same != 'true'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
